<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
      min-height: 100vh;
    }

    .app {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 24px;
      height: fit-content;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    button.add {
      background: #3b82f6;
      color: #fff;
      padding: 10px 18px;
    }

    button.add:hover { background: #2563eb; }

    ul { list-style: none; }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid #e5e7eb;
    }

    li:last-child { border-bottom: none; }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #22c55e;
      flex-shrink: 0;
    }

    li span {
      flex: 1;
      word-break: break-word;
    }

    li.done span {
      text-decoration: line-through;
      color: #9ca3af;
    }

    button.delete {
      background: transparent;
      color: #ef4444;
      padding: 6px 10px;
      flex-shrink: 0;
    }

    button.delete:hover { background: #fee2e2; }

    p.empty {
      color: #9ca3af;
      text-align: center;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Todo</h1>
    <form id="new-todo-form">
      <input type="text" id="new-todo-input" placeholder="What needs to be done?" aria-label="New todo" autocomplete="off">
      <button type="submit" class="add">Add</button>
    </form>
    <ul id="todo-list"></ul>
    <p class="empty" id="empty-message" hidden>No todos yet. Add one above!</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
