<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tetris</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <h1>TETRIS</h1>
    <div class="layout">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="overlay" class="overlay visible"><span id="overlay-text">Press Start</span></div>
      </div>
      <aside class="panel">
        <section class="card">
          <h2>Next</h2>
          <canvas id="next" width="96" height="96"></canvas>
        </section>
        <section class="card stats">
          <h2>Score</h2>
          <p id="score">0</p>
          <h2>Lines</h2>
          <p id="lines">0</p>
          <h2>Level</h2>
          <p id="level">1</p>
        </section>
        <section class="card buttons">
          <button id="start-btn">Start</button>
          <button id="pause-btn">Pause</button>
          <button id="restart-btn">Restart</button>
        </section>
        <section class="card help">
          <h2>Keys</h2>
          <ul>
            <li>&larr; &rarr; move</li>
            <li>&uarr; rotate</li>
            <li>&darr; soft drop</li>
            <li>Space hard drop</li>
            <li>P pause</li>
            <li>R restart</li>
          </ul>
        </section>
      </aside>
    </div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
