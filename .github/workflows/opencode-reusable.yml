name: OpenCode reusable pipeline

on:
  workflow_call:
    inputs:
      issue_number:
        description: Issue containing the OpenCode label
        required: true
        type: string
      request:
        description: Exact issue request text
        required: true
        type: string
      issue_title:
        description: Issue title for reporting
        required: true
        type: string
      labels_json:
        description: JSON array of issue label names
        required: false
        default: '[]'
        type: string
      sender:
        description: GitHub username that submitted the request
        required: true
        type: string
      pages_publish_enabled:
        description: Whether to configure and publish GitHub Pages
        required: false
        default: true
        type: boolean
    secrets:
      OPENCODE_API_KEY:
        required: false
      OPENCODE_AUTH_JSON:
        required: false
      AGENTSWEB_SSH_PUBLIC_KEY:
        required: false
jobs:
  opencode:
    # The mac label opts this run into GitHub's macOS hosted runner.
    runs-on: ${{ contains(inputs.labels_json, '"mac"') && 'macos-latest' || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: write
      pages: write
      pull-requests: write
      issues: write
    environment:
      name: ${{ inputs.pages_publish_enabled && vars.PAGES_PUBLISH_ENABLED != 'false' && 'github-pages' || '' }}
      url: ${{ steps.pages_deploy.outputs.page_url }}
    env:
      SSH_NAME: opencode-issue-${{ inputs.issue_number || github.event.pull_request.number || github.event.issue.number }}-${{ github.run_id }}-ssh
      SSH_KEY: ${{ github.workspace }}/opencode-agentsweb-id_ed25519
      SSH_PUBLIC_KEY: ${{ github.workspace }}/opencode-agentsweb-id_ed25519.pub
      SSH_DIR: ${{ github.workspace }}/.opencode-ssh
      OPENCODE_WEB_PORT: 4096
      OPENCODE_PROXY_PORT: 4097
      OPENCODE_WEB_DIR: ${{ github.workspace }}/.opencode-web
      PROJECT_PATH: ${{ vars.PROJECT_DIR || './' }}
      PROJECT_DIR: ${{ github.workspace }}/${{ vars.PROJECT_DIR || './' }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_JSON }}
      OPENCODE_EXPERIMENTAL: "true"
      OPENCODE_ENABLE_EXA: "true"
      OPENCODE_ENABLE_EXPERIMENTAL_MODELS: "true"
      OPENCODE_EXPERIMENTAL_BACKGROUND_SUBAGENTS: "true"
      OPENCODE_EXPERIMENTAL_WEBSOCKETS: "true"
      TARGET_OWNER: ${{ github.repository_owner }}
      TARGET_REPO: ${{ github.event.repository.name }}
      TARGET_REPOSITORY: ${{ github.repository }}
      GH_REPO: ${{ github.repository }}
      TARGET_REF: ${{ github.ref_name }}
      RUNTIME_DIR: ${{ github.workspace }}/.omgithub-runtime
      APP_PORT: 3000
      BRANCH_NAME: opencode/${{ github.run_id }}
      AGENTSWEB_SSH_ENABLED: ${{ secrets.AGENTSWEB_SSH_PUBLIC_KEY != '' }}
      TRIGGER_ISSUE_NUMBER: ${{ inputs.issue_number }}
      COMMENT_BODY: ${{ inputs.request }}
      TEST_GH_REQUEST: ${{ contains(inputs.labels_json, '"test-gh"') && contains(inputs.labels_json, '"OpenCode"') }}
      GOAL_REQUEST: ${{ contains(inputs.labels_json, '"Goal"') }}
      RALPH_REQUEST: ${{ contains(inputs.labels_json, '"ralph"') }}
      OMO_REQUEST: ${{ contains(inputs.labels_json, '"omo"') }}
      PAGES_PUBLISH_ENABLED: ${{ inputs.pages_publish_enabled && (vars.PAGES_PUBLISH_ENABLED || 'true') || 'false' }}
      VALIDATION_ENABLED: ${{ vars.VALIDATION_ENABLED || 'true' }}
    steps:
      - name: Export target token
        shell: bash
        run: echo "GH_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"

      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          token: ${{ github.token }}
          fetch-depth: 1
          persist-credentials: true

      - name: Checkout centralized OMG runtime
        if: env.TEST_GH_REQUEST != 'true'
        uses: actions/checkout@v6
        with:
          repository: AgentsLoop/OhMyGithub
          ref: main
          path: .omgithub-runtime
          token: ${{ github.token }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout AgentsWeb tunnel client
        if: env.TEST_GH_REQUEST != 'true'
        uses: actions/checkout@v6
        with:
          repository: agents-dev/agent-workspace
          path: .agentsweb
          sparse-checkout: |
            lolgames_tunnel
          persist-credentials: false

      - name: Resolve project directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROJECT_PATH" = /* || "$PROJECT_PATH" =~ (^|/)\.\.(/|$) ]]; then
            echo "PROJECT_DIR must be a path inside the repository: $PROJECT_PATH" >&2
            exit 1
          fi
          project_path="${PROJECT_PATH#./}"
          project_path="${project_path%/}"
          project_path="${project_path:-.}"
          printf 'PROJECT_PATH=%s\n' "$project_path" >> "$GITHUB_ENV"
          printf 'PROJECT_DIR=%s\n' "$GITHUB_WORKSPACE/${project_path#./}" >> "$GITHUB_ENV"

      - name: Checkout shared OpenCode skills
        if: env.TEST_GH_REQUEST != 'true'
        uses: actions/checkout@v6
        with:
          repository: agents-dev/skills
          path: ${{ vars.PROJECT_DIR || './' }}/.agents
          fetch-depth: 1
          persist-credentials: false

      - name: Exclude shared skills from generated changes
        if: env.TEST_GH_REQUEST != 'true'
        shell: bash
        run: |
          set -euo pipefail
          project_path="${PROJECT_PATH#./}"
          project_path="${project_path%/}"
          skills_path="${project_path:+/$project_path}/.agents/"
          ralph_state_path="${project_path:+/$project_path}/.opencode/ralph-loop.local.md"
          grep -qxF "$skills_path" .git/info/exclude || echo "$skills_path" >> .git/info/exclude
          grep -qxF "$ralph_state_path" .git/info/exclude || echo "$ralph_state_path" >> .git/info/exclude

          if [[ -z "$project_path" ]]; then
            for runtime_path in '/.agentsweb/' '/.omgithub-runtime/' '/.opencode-ssh/' '/.opencode-web/' \
              '/opencode-agentsweb-id_ed25519' '/opencode-agentsweb-id_ed25519.pub'; do
              grep -qxF "$runtime_path" .git/info/exclude || echo "$runtime_path" >> .git/info/exclude
            done
          fi

      - name: Install worker instructions
        if: env.TEST_GH_REQUEST != 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -d "$PROJECT_DIR"
          goal_instructions="$GOAL_REQUEST"
          if [[ "$RALPH_REQUEST" == 'true' ]]; then
            goal_instructions=false
          fi
          awk -v include_goal="$goal_instructions" -v include_ralph="$RALPH_REQUEST" '
            /<!-- GOAL_MODE_ONLY_BEGIN -->/ { in_goal = 1; next }
            /<!-- GOAL_MODE_ONLY_END -->/ { in_goal = 0; next }
            /<!-- RALPH_MODE_ONLY_BEGIN -->/ { in_ralph = 1; next }
            /<!-- RALPH_MODE_ONLY_END -->/ { in_ralph = 0; next }
            (!in_goal || include_goal == "true") && (!in_ralph || include_ralph == "true") { print }
          ' "$RUNTIME_DIR/agents.template.md" > "$PROJECT_DIR/Agents.md"

          if [[ "$goal_instructions" == "true" ]]; then
            grep -qF 'When running in Goal mode' "$PROJECT_DIR/Agents.md"
          else
            if grep -qF 'When running in Goal mode' "$PROJECT_DIR/Agents.md"; then
              echo 'Goal-mode instructions leaked into a standard-mode Agents.md.' >&2
              exit 1
            fi
          fi
          if [[ "$RALPH_REQUEST" == "true" ]]; then
            grep -qF 'When running in Ralph mode' "$PROJECT_DIR/Agents.md"
          elif grep -qF 'When running in Ralph mode' "$PROJECT_DIR/Agents.md"; then
            echo 'Ralph-mode instructions leaked into a non-Ralph Agents.md.' >&2
            exit 1
          fi

      - name: Sync OpenCode labels
        if: env.TEST_GH_REQUEST != 'true'
        uses: actions/github-script@v7
        env:
          OPENCODE_MODEL: opencode/muse-spark-1.3-contributor-free
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const catalog = await fetch('https://models.opencode.ai/api.json').then(async (response) => {
              if (!response.ok) throw new Error(`OpenCode model catalog returned ${response.status}`);
              return response.json();
            });
            const models = Object.values(catalog.opencode?.models ?? {})
              .filter((model) =>
                (model.cost?.input === 0 && model.cost?.output === 0 && model.cost?.cache_read === 0) ||
                model.id === 'gpt-5.6-luna'
              )
              .map((model) => model.id)
              .filter(Boolean)
              .sort();
            if (!models.includes(process.env.OPENCODE_MODEL.slice('opencode/'.length))) {
              throw new Error(`Configured model is missing from the OpenCode catalog: ${process.env.OPENCODE_MODEL}`);
            }
            const openaiLuna = catalog.openai?.models?.['gpt-5.6-luna'];
            if (!openaiLuna) {
              throw new Error('OpenAI catalog is missing gpt-5.6-luna');
            }

            const skillsRoot = path.join(process.env.PROJECT_DIR, '.agents', 'skills');
            const skillNames = fs.existsSync(skillsRoot)
              ? fs.readdirSync(skillsRoot, { withFileTypes: true })
                  .filter((entry) => entry.isDirectory())
                  .filter((entry) => fs.existsSync(path.join(skillsRoot, entry.name, 'SKILL.md')))
                  .map((entry) => entry.name)
              : [];

            const labels = [
              { name: 'in progress', color: 'FBCA04', description: 'OpenCode workflow is running' },
              { name: 'validating', color: '1D76DB', description: 'OpenCode workflow is validating the result' },
              { name: 'complete', color: '0E8A16', description: 'OpenCode workflow completed successfully' },
              { name: 'blocked', color: 'D93F0B', description: 'OpenCode Goal needs user input or bounded recovery was exhausted' },
              { name: 'failed', color: 'B60205', description: 'OpenCode workflow failed' },
              { name: 'Goal', color: '8A2BE2', description: 'Run OMG with the persistent Goal command' },
              { name: 'ralph', color: '5319E7', description: 'Run OpenCode with the Ralph auto-continuation loop' },
              { name: 'omo', color: '5319E7', description: 'Preinstall oh-my-openagent for this OpenCode run' },
              { name: 'test-gh', color: '1D76DB', description: 'Bypass OpenCode and test GitHub Pages publication' },
              { name: 'mac', color: 'B60205', description: 'Run OpenCode on the macos-latest GitHub-hosted runner' },
              ...models.map((model) => ({
                name: `model/opencode/${model}`,
                color: '5319E7',
                description: `OpenCode model: opencode/${model}`
              })),
              {
                name: 'model/openai/gpt-5.6-luna',
                color: '5319E7',
                description: 'OpenAI model: openai/gpt-5.6-luna'
              },
              ...skillNames.map((name) => ({
                name: `skill/${name}`,
                color: '1D76DB',
                description: `OpenCode skill: ${name}`
              }))
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: process.env.TARGET_OWNER,
                  repo: process.env.TARGET_REPO,
                  ...label
                });
              } catch (error) {
                if (error.status !== 422) throw error;
                await github.rest.issues.updateLabel({
                  owner: process.env.TARGET_OWNER,
                  repo: process.env.TARGET_REPO,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

            const managedPrefixes = ['model/', 'skill/'];
            const defaultLabels = new Set([
              'bug', 'documentation', 'duplicate', 'enhancement', 'good first issue',
              'help wanted', 'invalid', 'question', 'wontfix'
            ]);
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: process.env.TARGET_OWNER,
              repo: process.env.TARGET_REPO,
              per_page: 100
            });
            const desired = new Set(labels.map(({ name }) => name));
            for (const label of existing) {
              if (defaultLabels.has(label.name) ||
                  (managedPrefixes.some((prefix) => label.name.startsWith(prefix)) && !desired.has(label.name))) {
                await github.rest.issues.deleteLabel({
                  owner: process.env.TARGET_OWNER,
                  repo: process.env.TARGET_REPO,
                  name: label.name
                });
              }
            }

            core.info(`Synchronized ${labels.length} labels from the live OpenCode catalog and shared skills`);

      - name: Mark issue in progress
        uses: actions/github-script@v7
        env:
          GOAL_REQUEST: ${{ env.GOAL_REQUEST }}
          RALPH_REQUEST: ${{ env.RALPH_REQUEST }}
        with:
          github-token: ${{ github.token }}
          script: |
            const number = Number(process.env.TRIGGER_ISSUE_NUMBER);
            const statuses = ['in progress', 'validating', 'complete', 'failed'];
            for (const status of statuses) {
              try {
                await github.rest.issues.removeLabel({
                  owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO,
                  issue_number: number, name: status
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            await github.rest.issues.addLabels({
              owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO,
              issue_number: number,
              labels: [
                'in progress',
                ...(process.env.GOAL_REQUEST === 'true' ? ['Goal'] : []),
                ...(process.env.RALPH_REQUEST === 'true' ? ['ralph'] : [])
              ]
            });

      - name: Start AgentsWeb SSH session
        id: agentsweb
        if: env.TEST_GH_REQUEST != 'true' && env.AGENTSWEB_SSH_ENABLED == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # GITHUB_RUN_NUMBER starts at 1 in every repository, so using it here
          # makes every new repository's first OMG run contend for port 32001.
          # GITHUB_RUN_ID is globally unique and distributes runs across the
          # broker's 32000-32999 public-port range.
          SSH_PORT=$((32000 + GITHUB_RUN_ID % 1000))
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == 'Linux' ]]; then
            sudo apt-get update
            sudo apt-get install -y openssh-server tmux
          else
            command -v tmux >/dev/null 2>&1 || brew install tmux
          fi
          install -d -m 700 "$SSH_DIR"
          ssh-keygen -t ed25519 -f "$SSH_KEY" -N '' -q
          chmod 600 "$SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          {
            cat "$SSH_PUBLIC_KEY"
            printf '%s\n' '${{ secrets.AGENTSWEB_SSH_PUBLIC_KEY }}'
          } > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          [[ "$RUNNER_OS" != 'Linux' ]] || sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222 -o PasswordAuthentication=no \
            -o PermitRootLogin=no -o PubkeyAuthentication=yes
          is_listening() {
            if command -v ss >/dev/null 2>&1; then
              ss -ltn | grep -q ':2222 '
            else
              lsof -nP -iTCP:2222 -sTCP:LISTEN >/dev/null 2>&1
            fi
          }
          for _ in {1..20}; do
            is_listening && break
            sleep 1
          done
          is_listening
          nohup env PYTHONPATH="$GITHUB_WORKSPACE/.agentsweb" \
            python3 -m lolgames_tunnel client 127.0.0.1:2222 \
            --server agentsweb.space --name "$SSH_NAME" --public-port "$SSH_PORT" \
            > "$SSH_DIR/tunnel.log" 2>&1 &
          echo $! > "$SSH_DIR/tunnel.pid"
          for _ in {1..45}; do
            grep -q 'agentsweb.space' "$SSH_DIR/tunnel.log" && break
            sleep 1
          done
          grep -q 'agentsweb.space' "$SSH_DIR/tunnel.log"
          SSH_HOST="${SSH_NAME}.agentsweb.space"
          SSH_COMMAND="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/aiplay-agentsweb -p ${SSH_PORT} runner@${SSH_HOST}"
          printf 'host=%s\nport=%s\ncommand=%s\n' "$SSH_HOST" "$SSH_PORT" "$SSH_COMMAND" >> "$GITHUB_OUTPUT"

      - name: Start OpenCode web UI and Cloudflare tunnel
        id: opencode_web
        if: env.TEST_GH_REQUEST != 'true'
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          install -d -m 700 "$OPENCODE_WEB_DIR"
          OPENCODE_VERSION="$(
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              https://api.github.com/repos/anomalyco/opencode/releases/latest \
              | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p'
          )"
          [[ "$OPENCODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          curl --fail --silent --show-error --location https://opencode.ai/install \
            | bash -s -- --version "$OPENCODE_VERSION"
          OPENCODE_BIN="$HOME/.opencode/bin/opencode"
          [[ -x "$OPENCODE_BIN" ]]
          install -d -m 700 "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "plugin": [],
            "permission": {
              "*": "allow",
              "task": "allow"
            }
          }
          EOF
          if [[ "$OMO_REQUEST" == 'true' && "$RALPH_REQUEST" != 'true' ]]; then
            echo 'Installing oh-my-openagent for the omo-labeled request'
            if ! command -v bun >/dev/null 2>&1; then
              curl --fail --silent --show-error --location https://bun.sh/install | bash
            fi
            export BUN_INSTALL="${BUN_INSTALL:-$HOME/.bun}"
            export PATH="$BUN_INSTALL/bin:$PATH"
            command -v bun
            bunx oh-my-openagent install \
              --no-tui \
              --platform=opencode \
              --claude=no \
              --openai=no \
              --gemini=no \
              --copilot=no \
              --opencode-zen=no \
              --zai-coding-plan=no \
              --opencode-go=no \
              --kimi-for-coding=no \
              --bailian-coding-plan=no \
              --minimax-cn-coding-plan=no \
              --minimax-coding-plan=no \
              --vercel-ai-gateway=no \
              --skip-auth
          fi
          config_tmp="$OPENCODE_WEB_DIR/opencode.json"
          if [[ "$RALPH_REQUEST" == 'true' ]]; then
            npm install --prefix "$HOME/.config/opencode" --no-save --no-package-lock \
              --ignore-scripts opencode-ralph-loop@1.0.10
            jq '
              .plugin = ((.plugin // []) + ["opencode-ralph-loop"]) |
              .permission = ((.permission // {}) + {"*": "allow", "task": "allow"})
            ' "$HOME/.config/opencode/opencode.json" > "$config_tmp"
          elif [[ "$OMO_REQUEST" != 'true' ]]; then
            npm install --prefix "$HOME/.config/opencode" --no-save --no-package-lock \
              --ignore-scripts opencode-goal-plugin@0.8.2
            jq '
              .plugin = ((.plugin // []) + [["opencode-goal-plugin", {"noInterruptOnUserMessage": true}]]) |
              .command.goal = {
                "description": "Set a session-scoped goal and auto-continue until complete.",
                "template": "$ARGUMENTS",
                "agent": "build"
              } |
              .permission = ((.permission // {}) + {"*": "allow", "task": "allow"})
            ' "$HOME/.config/opencode/opencode.json" > "$config_tmp"
          else
            jq '.permission = ((.permission // {}) + {"*": "allow", "task": "allow"})' \
              "$HOME/.config/opencode/opencode.json" > "$config_tmp"
          fi
          mv "$config_tmp" "$HOME/.config/opencode/opencode.json"
          PORTS="$(node --input-type=module -e '
            import net from "node:net";
            const server = net.createServer();
            await new Promise((resolve, reject) => {
              server.once("error", reject);
              server.listen(0, "127.0.0.1", resolve);
            });
            console.log(server.address().port);
            server.close();
          ')"
          OPENCODE_WEB_PORT="$PORTS"
          OPENCODE_PROXY_PORT="$OPENCODE_WEB_PORT"
          [[ "$OPENCODE_WEB_PORT" =~ ^[0-9]+$ ]]
          {
            printf 'OPENCODE_WEB_PORT=%s\n' "$OPENCODE_WEB_PORT"
            printf 'OPENCODE_PROXY_PORT=%s\n' "$OPENCODE_PROXY_PORT"
          } >> "$GITHUB_ENV"
          echo "Allocated OpenCode port: $OPENCODE_WEB_PORT"
          nohup "$OPENCODE_BIN" serve --hostname 127.0.0.1 --port "$OPENCODE_WEB_PORT" \
            > "$OPENCODE_WEB_DIR/opencode.log" 2>&1 &
          echo $! > "$OPENCODE_WEB_DIR/opencode.pid"
          wait_for_http() {
            local url="$1"
            local attempts="$2"
            local response_code
            for _ in $(seq 1 "$attempts"); do
              response_code="$(curl --silent --show-error --max-time 3 \
                --output /dev/null --write-out '%{http_code}' "$url" || true)"
              if [[ "$response_code" =~ ^2[0-9][0-9]$ ]]; then
                return 0
              fi
              sleep 1
            done
            return 1
          }
          if ! wait_for_http "http://127.0.0.1:$OPENCODE_WEB_PORT/global/health" 45; then
            echo 'OpenCode server did not become healthy; server log follows:' >&2
            curl --silent --show-error --max-time 10 \
              -i "http://127.0.0.1:$OPENCODE_WEB_PORT/global/health" >&2 || true
            sed -n '1,160p' "$OPENCODE_WEB_DIR/opencode.log" >&2 || true
            exit 1
          fi
          echo 'Cloudflare will tunnel directly to the workspace-scoped OpenCode server'
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) CLOUDFLARED_ASSET='cloudflared-linux-amd64' ;;
            Linux/ARM64) CLOUDFLARED_ASSET='cloudflared-linux-arm64' ;;
            macOS/X64) CLOUDFLARED_ASSET='cloudflared-darwin-amd64' ;;
            macOS/ARM64) CLOUDFLARED_ASSET='cloudflared-darwin-arm64' ;;
            *) echo "Unsupported runner platform: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --location --output "$OPENCODE_WEB_DIR/cloudflared" \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/$CLOUDFLARED_ASSET"
          chmod 755 "$OPENCODE_WEB_DIR/cloudflared"
          nohup "$OPENCODE_WEB_DIR/cloudflared" tunnel --no-autoupdate --url "http://127.0.0.1:$OPENCODE_PROXY_PORT" \
            > "$OPENCODE_WEB_DIR/cloudflared.log" 2>&1 &
          echo $! > "$OPENCODE_WEB_DIR/cloudflared.pid"
          for _ in {1..60}; do
            WEB_URL="$(sed -nE 's#.*(https://[a-z0-9-]+\.trycloudflare\.com).*#\1#p' "$OPENCODE_WEB_DIR/cloudflared.log" | head -n 1)"
            [[ -n "$WEB_URL" ]] && break
            sleep 1
          done
          [[ -n "${WEB_URL:-}" ]]
          printf 'url=%s\n' "$WEB_URL" >> "$GITHUB_OUTPUT"

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name 'opencode[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Create OpenCode branch
        if: env.TEST_GH_REQUEST != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE_BRANCH="$TARGET_REF"
          git fetch origin "$BASE_BRANCH"
          git checkout -B "$BRANCH_NAME" "origin/$BASE_BRANCH"

      - name: Create test-gh Hello World branch
        if: env.TEST_GH_REQUEST == 'true'
        id: test_delivery
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          BASE_BRANCH="$TARGET_REF"
          git fetch origin "$BASE_BRANCH"
          TEST_BRANCH_NAME="test-gh/hello-world-${GITHUB_RUN_ID}-$(openssl rand -hex 8)"
          git checkout -B "$TEST_BRANCH_NAME" "origin/$BASE_BRANCH"
          printf 'BRANCH_NAME=%s\n' "$TEST_BRANCH_NAME" >> "$GITHUB_ENV"
          mkdir -p dist
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Hello World — GitHub Pages smoke test</title>
            </head>
            <body>
              <main>
                <h1>Hello World</h1>
                <p>GitHub Pages publication smoke test passed.</p>
              </main>
            </body>
          </html>
          EOF
          git add dist/index.html
          git commit -m "Test GitHub Pages publication with Hello World"
          git push --set-upstream origin "$TEST_BRANCH_NAME"
          FINAL_COMMIT="$(git rev-parse HEAD)"
          printf 'commit=%s\nbranch=%s\n' "$FINAL_COMMIT" "$TEST_BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "Created and pushed test branch $TEST_BRANCH_NAME at $FINAL_COMMIT"

      - name: Resolve OpenCode model and skill labels
        id: opencode_labels
        if: env.TEST_GH_REQUEST != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const number = Number(process.env.TRIGGER_ISSUE_NUMBER);
            const response = await github.rest.issues.listLabelsOnIssue({
              owner: process.env.TARGET_OWNER,
              repo: process.env.TARGET_REPO,
              issue_number: number,
              sort: 'created',
              direction: 'asc',
              per_page: 100
            });
            const names = response.data.map(({ name }) => name);
            const modelLabels = names.filter((name) => name.startsWith('model/'));
            if (modelLabels.length > 1) {
              core.setFailed(`Expected at most one model/* label, found: ${modelLabels.join(', ')}`);
              return;
            }
            const model = modelLabels[0]?.slice('model/'.length) || 'opencode/muse-spark-1.3-contributor-free';
            const skills = names.filter((name) => name.startsWith('skill/'))
              .map((name) => name.slice('skill/'.length)).sort();
            core.setOutput('model', model);
            core.setOutput('skills_json', JSON.stringify(skills));
            core.info(`Resolved model=${model}; skills=${skills.join(', ') || '(none)'}`);

      - name: Run OpenCode and locate its web session
        id: opencode_run
        if: env.TEST_GH_REQUEST != 'true'
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_WEB_URL: ${{ steps.opencode_web.outputs.url }}
          OPENCODE_MODEL: ${{ steps.opencode_labels.outputs.model }}
          OPENCODE_SKILLS: ${{ steps.opencode_labels.outputs.skills_json }}
          GOAL_REQUEST: ${{ env.GOAL_REQUEST }}
          RALPH_REQUEST: ${{ env.RALPH_REQUEST }}
          OMO_REQUEST: ${{ env.OMO_REQUEST }}
        run: |
          set -euo pipefail
          OPENCODE_BIN="$HOME/.opencode/bin/opencode"
          PROMPT_FILE="$OPENCODE_WEB_DIR/prompt.txt"
          RUN_LOG="$OPENCODE_WEB_DIR/opencode-run.log"
          RUN_EXIT="$OPENCODE_WEB_DIR/opencode-run.exit"
          skill_text="$(jq -r 'if length == 0 then "(none)" else join(", ") end' <<<"$OPENCODE_SKILLS")"
          prompt_template="$(< "$RUNTIME_DIR/.github/prompts/01-build.md")"
          request_text="$COMMENT_BODY"
          prompt="${prompt_template//@COMMENT_BODY@/$request_text}"
          prompt="${prompt//@OPENCODE_MODEL@/$OPENCODE_MODEL}"
          prompt="${prompt//@SKILL_TEXT@/$skill_text}"
          if [[ "$OMO_REQUEST" == 'true' && "$RALPH_REQUEST" != 'true' ]]; then
            prompt=$'ulw\n\n'"$prompt"
          fi
          printf '%s\n' "$prompt" > "$PROMPT_FILE"
          if [[ "$OMO_REQUEST" == 'true' && "$RALPH_REQUEST" != 'true' ]]; then
            cat >> "$PROMPT_FILE" <<'EOF'

            This request has the `omo` issue label. Use oh-my-openagent Ultimate's native Goal system for the persistent objective and `ulw` for full OMO orchestration. Keep the objective active through verified implementation iterations and do not stop after the first successful pass. Preserve the workflow's evidence, commit, and push requirements.
          EOF
          fi
          if [[ "$OMO_REQUEST" == 'true' && "$RALPH_REQUEST" != 'true' ]]; then
            echo 'OpenCode invocation mode: omo-goal-ulw'
          elif [[ "$RALPH_REQUEST" == 'true' ]]; then
            echo 'OpenCode invocation mode: ralph-loop'
          else
            echo "OpenCode invocation mode: $([[ "$GOAL_REQUEST" == 'true' ]] && echo goal || echo standard)"
          fi
          # The inner shell expands the positional parameters after nohup starts.
          # shellcheck disable=SC2016
          nohup bash -c '
            if [[ "$9" == true ]]; then
              "$1" run --auto --dangerously-skip-permissions --attach "http://127.0.0.1:$2" --model "$6" --command ralph-loop "$(cat "$3")" > "$4" 2>&1
            elif [[ "$8" == true ]]; then
              "$1" run --auto --dangerously-skip-permissions --attach "http://127.0.0.1:$2" --model "$6" --command goal "$(cat "$3")" > "$4" 2>&1
            elif [[ "$7" == true ]]; then
              "$1" run --auto --dangerously-skip-permissions --attach "http://127.0.0.1:$2" --model "$6" --command goal "$(cat "$3")" > "$4" 2>&1
            else
              "$1" run --auto --dangerously-skip-permissions --attach "http://127.0.0.1:$2" --model "$6" "$(cat "$3")" > "$4" 2>&1
            fi
            code=$?
            echo "$code" > "$5"
            exit "$code"
          ' \
            _ "$OPENCODE_BIN" "$OPENCODE_WEB_PORT" "$PROMPT_FILE" "$RUN_LOG" "$RUN_EXIT" "$OPENCODE_MODEL" "$GOAL_REQUEST" "$OMO_REQUEST" "$RALPH_REQUEST" \
            > /dev/null 2>&1 &
          echo $! > "$OPENCODE_WEB_DIR/opencode-run.pid"
          SESSION_ID=''
          for _ in {1..120}; do
            SESSION_ID="$(curl --fail --silent --show-error \
              -H "x-opencode-directory: $PROJECT_DIR" \
              "http://127.0.0.1:$OPENCODE_WEB_PORT/session" | jq -r '.[0].id // empty')"
            [[ "$SESSION_ID" == ses_* ]] && break
            sleep 1
          done
          [[ "$SESSION_ID" == ses_* ]]
          DIRECTORY_B64="$(printf '%s' "$PROJECT_DIR" | base64 | tr -d '\n' | tr '+/' '-_' | tr -d '=')"
          printf 'session_id=%s\nsession_url=%s\n' "$SESSION_ID" \
            "${OPENCODE_WEB_URL}/${DIRECTORY_B64}/session/${SESSION_ID}" >> "$GITHUB_OUTPUT"

      - name: Verify live sessions through SSH
        id: verify_sessions
        if: env.TEST_GH_REQUEST != 'true' && env.AGENTSWEB_SSH_ENABLED == 'true' && steps.agentsweb.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "Expected session: ${{ steps.opencode_run.outputs.session_id }}"
          for _ in {1..12}; do
            if ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=20 -o ConnectionAttempts=1 -i "$SSH_KEY" \
              -p "${{ steps.agentsweb.outputs.port }}" \
              "runner@${{ steps.agentsweb.outputs.host }}" \
              "curl --fail --silent --show-error -H 'x-opencode-directory: $PROJECT_DIR' http://127.0.0.1:$OPENCODE_WEB_PORT/session" \
              > "$OPENCODE_WEB_DIR/ssh-sessions.json"; then
              break
            fi
            sleep 5
          done
          [[ -s "$OPENCODE_WEB_DIR/ssh-sessions.json" ]]
          echo
          echo 'Sessions returned through SSH:'
          jq . "$OPENCODE_WEB_DIR/ssh-sessions.json"
          jq -e --arg session "${{ steps.opencode_run.outputs.session_id }}" \
            'any(.[]; .id == $session)' "$OPENCODE_WEB_DIR/ssh-sessions.json"

      - name: Post temporary access details
        id: access_comment
        if: env.TEST_GH_REQUEST != 'true'
        uses: actions/github-script@v7
        env:
          AGENTSWEB_SSH_ENABLED: ${{ env.AGENTSWEB_SSH_ENABLED }}
          AGENTSWEB_SSH_READY: ${{ steps.agentsweb.outcome == 'success' }}
          SSH_COMMAND: ${{ steps.agentsweb.outputs.command }}
          SSH_HOST: ${{ steps.agentsweb.outputs.host }}
          SSH_PORT: ${{ steps.agentsweb.outputs.port }}
          OPENCODE_WEB_URL: ${{ steps.opencode_run.outputs.session_url }}
          GOAL_REQUEST: ${{ env.GOAL_REQUEST }}
          RALPH_REQUEST: ${{ env.RALPH_REQUEST }}
        with:
          github-token: ${{ github.token }}
          script: |
            const number = Number(process.env.TRIGGER_ISSUE_NUMBER);
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const command = process.env.RALPH_REQUEST === 'true'
              ? 'OpenCode with Ralph Loop'
              : (process.env.GOAL_REQUEST === 'true' ? 'OpenCode with Goal' : 'OpenCode');
            const body = [];
            if (process.env.AGENTSWEB_SSH_ENABLED === 'true' && process.env.AGENTSWEB_SSH_READY === 'true') {
              body.push(
                '🔐 **Temporary AgentsWeb SSH session is ready.**', '',
                `Run: ${run}`, `Host: \`${process.env.SSH_HOST}:${process.env.SSH_PORT}\``, '',
                'Run this command while the job is active:', '',
                '```sh', process.env.SSH_COMMAND, '```', ''
              );
            }
            body.push(
              '🌐 **Live OpenCode web session is ready.**', '',
              `URL: ${process.env.OPENCODE_WEB_URL}`, '',
              `This opens the currently running ${command} session directly. Access remains available while OpenCode runs and for 5 hours afterwards.`
            );
            const comment = await github.rest.issues.createComment({
              owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO, issue_number: number, body: body.join('\n')
            });
            core.setOutput('comment_id', comment.data.id);

      - name: Start live OpenCode response comment
        id: response_comment
        if: env.TEST_GH_REQUEST != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ steps.access_comment.outputs.comment_id }}
          SESSION_ID: ${{ steps.opencode_run.outputs.session_id }}
          OPENCODE_WEB_URL: ${{ steps.opencode_run.outputs.session_url }}
          ISSUE_NUMBER: ${{ env.TRIGGER_ISSUE_NUMBER }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TRACKER="$OPENCODE_WEB_DIR/response-comment-tracker.sh"
          install -m 700 "$RUNTIME_DIR/scripts/opencode-progress-tracker.sh" "$TRACKER"
          # The tracker is intentionally independent of the step shell so it can poll
          # while later workflow steps run; cleanup stops it at the end of the job.
          nohup env PROJECT_DIR="$PROJECT_DIR" OPENCODE_WEB_PORT="$OPENCODE_WEB_PORT" \
            OPENCODE_WEB_DIR="$OPENCODE_WEB_DIR" SESSION_ID="$SESSION_ID" \
            COMMENT_ID="$COMMENT_ID" REPOSITORY="$REPOSITORY" GH_TOKEN="$GH_TOKEN" \
            "$TRACKER" > "$OPENCODE_WEB_DIR/response-comment-tracker.log" 2>&1 &
          echo $! > "$OPENCODE_WEB_DIR/response-comment-tracker.pid"

      - name: Recover blocked Goal with Zen critique
        id: blocked_recovery
        if: env.TEST_GH_REQUEST != 'true' && env.GOAL_REQUEST == 'true'
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SESSION_ID: ${{ steps.opencode_run.outputs.session_id }}
          OPENCODE_MODEL: ${{ steps.opencode_labels.outputs.model }}
          CRITIQUE_TEMPLATE: ${{ env.RUNTIME_DIR }}/.github/prompts/critique-blocked.md
          ORIGINAL_REQUEST: ${{ env.COMMENT_BODY }}
        run: |
          set -euo pipefail
          echo 'GOAL_BLOCKED=false' >> "$GITHUB_ENV"
          RUN_EXIT="$OPENCODE_WEB_DIR/opencode-run.exit"
          RUN_LOG="$OPENCODE_WEB_DIR/opencode-run.log"
          MESSAGES_FILE="$OPENCODE_WEB_DIR/opencode-response-before-recovery.json"
          CONTEXT_FILE="$OPENCODE_WEB_DIR/blocked-goal-context.md"
          OPENCODE_BIN="$HOME/.opencode/bin/opencode"
          max_attempts=3

          for _ in {1..21600}; do
            [[ -f "$RUN_EXIT" ]] && break
            sleep 1
          done
          [[ -f "$RUN_EXIT" ]]
          initial_code="$(cat "$RUN_EXIT")"

          fetch_messages() {
            curl --fail --silent --show-error \
              -H "x-opencode-directory: $PROJECT_DIR" \
              "http://127.0.0.1:$OPENCODE_WEB_PORT/session/$SESSION_ID/message" \
              > "$MESSAGES_FILE"
          }

          has_blocked_marker() {
            local current_log="${1:-$RUN_LOG}"
            grep -Eiq '\[goal:blocked\]|"status"[[:space:]]*:[[:space:]]*"blocked"|status[^[:alnum:]]+blocked' "$current_log" && return 0
            if [[ "$current_log" == "$RUN_LOG" ]]; then
              jq -e '.. | strings | select(test("\\[goal:blocked\\]|update_goal|AAA COD parity|status[^[:alnum:]]+blocked"; "i"))' \
                "$MESSAGES_FILE" >/dev/null 2>&1
            else
              return 1
            fi
          }

          fetch_messages
          blocked=false
          if has_blocked_marker; then
            blocked=true
            echo 'GOAL_BLOCKED=true' >> "$GITHUB_ENV"
          elif [[ "$initial_code" != 0 ]]; then
            echo "OpenCode exited with $initial_code without a blocked Goal marker." >&2
            exit "$initial_code"
          fi

          if [[ "$blocked" != true ]]; then
            echo 'Goal completed without a blocked marker; continuing to verification.'
            exit 0
          fi

          for attempt in $(seq 1 "$max_attempts"); do
            {
              echo '# OpenCode blocked Goal evidence'
              echo
              tail -c 50000 "$RUN_LOG" || true
              echo
              echo '# Matching session transcript strings'
              jq -r '.. | strings | select(test("\\[goal:blocked\\]|update_goal|AAA COD parity|status[^[:alnum:]]+blocked"; "i"))' \
                "$MESSAGES_FILE" 2>/dev/null | tail -c 30000 || true
            } > "$CONTEXT_FILE"

            critique_file="$OPENCODE_WEB_DIR/blocked-critique-$attempt.md"
            echo "Goal is blocked; generating Zen critique $attempt/$max_attempts."
            CRITIQUE_TEMPLATE="$CRITIQUE_TEMPLATE" \
              BLOCKED_CONTEXT_FILE="$CONTEXT_FILE" \
              ORIGINAL_REQUEST="$ORIGINAL_REQUEST" \
              OUTPUT_FILE="$critique_file" \
              OPENCODE_SESSION_ID="$SESSION_ID" \
              OPENCODE_CAPTURE_FILE="$OPENCODE_WEB_DIR/zen-critique-$attempt-request.json" \
              "$RUNTIME_DIR/scripts/generate-blocked-critique.sh"

            "$OPENCODE_BIN" run \
              --auto \
              --dangerously-skip-permissions \
              --attach "http://127.0.0.1:$OPENCODE_WEB_PORT" \
              --session "$SESSION_ID" \
              --model "$OPENCODE_MODEL" \
              --command goal \
              "$(< "$critique_file")" \
              > "$OPENCODE_WEB_DIR/blocked-recovery-$attempt.log" 2>&1

            fetch_messages
            recovery_log="$OPENCODE_WEB_DIR/blocked-recovery-$attempt.log"
            if ! has_blocked_marker "$recovery_log"; then
              echo 'GOAL_BLOCKED=false' >> "$GITHUB_ENV"
              echo "Blocked Goal recovery succeeded on attempt $attempt."
              exit 0
            fi
            echo "Goal remains blocked after attempt $attempt; preparing another critique."
          done

          echo 'Goal remained blocked after bounded Zen recovery attempts.' >&2
          echo 'GOAL_BLOCKED=true' >> "$GITHUB_ENV"
          exit 1

      - name: Verify Ralph completion promise
        if: env.TEST_GH_REQUEST != 'true' && env.RALPH_REQUEST == 'true'
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SESSION_ID: ${{ steps.opencode_run.outputs.session_id }}
        run: |
          set -euo pipefail
          RUN_EXIT="$OPENCODE_WEB_DIR/opencode-run.exit"
          RUN_LOG="$OPENCODE_WEB_DIR/opencode-run.log"
          RESPONSE_FILE="$OPENCODE_WEB_DIR/ralph-response.json"
          for _ in {1..21600}; do
            [[ -f "$RUN_EXIT" ]] && break
            sleep 1
          done
          [[ -f "$RUN_EXIT" ]]
          code="$(cat "$RUN_EXIT")"
          [[ "$code" == 0 ]]
          curl --fail --silent --show-error \
            -H "x-opencode-directory: $PROJECT_DIR" \
            "http://127.0.0.1:$OPENCODE_WEB_PORT/session/$SESSION_ID/message" \
            > "$RESPONSE_FILE"
          response_text="$(jq -r '[.[] | select(.info.role == "assistant") | (.parts[]? | select(.type == "text") | .text)] | join("\n")' "$RESPONSE_FILE")"
          if grep -Eiq '<promise>DONE</promise>' "$RUN_LOG" || grep -Eiq '<promise>DONE</promise>' <<<"$response_text"; then
            echo 'Ralph completion promise verified.'
          else
            echo 'Ralph stopped without <promise>DONE</promise>; refusing completion.' >&2
            exit 1
          fi

      - name: Mark issue validating
        if: env.TEST_GH_REQUEST != 'true' && env.VALIDATION_ENABLED == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const number = Number(process.env.TRIGGER_ISSUE_NUMBER);
            await github.rest.issues.removeLabel({
              owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO,
              issue_number: number, name: 'in progress'
            }).catch((error) => { if (error.status !== 404) throw error; });
            await github.rest.issues.addLabels({
              owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO,
              issue_number: number, labels: ['validating']
            });

      - name: Fork OpenCode session for verification
        id: verification_fork
        if: env.TEST_GH_REQUEST != 'true' && env.VALIDATION_ENABLED == 'true'
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          for _ in {1..21600}; do
            [[ -f "$OPENCODE_WEB_DIR/opencode-run.exit" ]] && break
            sleep 1
          done
          [[ -f "$OPENCODE_WEB_DIR/opencode-run.exit" ]]
          code="$(cat "$OPENCODE_WEB_DIR/opencode-run.exit")"
          echo "OpenCode exited with code $code"
          [[ "$code" == 0 ]]

          BUILD_SESSION_ID='${{ steps.opencode_run.outputs.session_id }}'
          VERIFICATION_SESSION_ID="$(curl --fail --silent --show-error \
            -X POST \
            -H "x-opencode-directory: $PROJECT_DIR" \
            "http://127.0.0.1:$OPENCODE_WEB_PORT/session/$BUILD_SESSION_ID/fork" \
            | jq -r '.id // empty')"
          [[ "$VERIFICATION_SESSION_ID" == ses_* ]]
          DIRECTORY_B64="$(printf '%s' "$PROJECT_DIR" | base64 | tr -d '\n' | tr '+/' '-_' | tr -d '=')"
          printf 'session_id=%s\nsession_url=%s\n' "$VERIFICATION_SESSION_ID" \
            "${{ steps.opencode_web.outputs.url }}/${DIRECTORY_B64}/session/${VERIFICATION_SESSION_ID}" >> "$GITHUB_OUTPUT"
          echo "Verification fork: $VERIFICATION_SESSION_ID"

      - name: Verify app with forked OpenCode session
        if: env.TEST_GH_REQUEST != 'true' && env.VALIDATION_ENABLED == 'true'
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          OPENCODE_BIN="$HOME/.opencode/bin/opencode"
          "$OPENCODE_BIN" run \
            --auto \
            --dangerously-skip-permissions \
            --attach "http://127.0.0.1:$OPENCODE_WEB_PORT" \
            --session "${{ steps.verification_fork.outputs.session_id }}" \
            --model "${{ steps.opencode_labels.outputs.model }}" \
            "$(< "$RUNTIME_DIR/.github/prompts/02-verify.md")" \
            > "$OPENCODE_WEB_DIR/verification.log" 2>&1

      - name: Verify browser entrypoint exists
        if: env.TEST_GH_REQUEST != 'true' && env.VALIDATION_ENABLED == 'true'
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          OPENCODE_BIN="$HOME/.opencode/bin/opencode"
          SESSION_ID='${{ steps.verification_fork.outputs.session_id }}'
          ENTRYPOINT_PROMPT='The browser verifier cannot find a playable HTML entrypoint. Ensure the requested app has a working index.html at the project root or dist/index.html, make the app server serve that entrypoint on port 3000, and verify it in the browser before replying.'

          for attempt in 1 2 3; do
            if [[ -f "$PROJECT_DIR/index.html" || -f "$PROJECT_DIR/dist/index.html" ]]; then
              if [[ -f "$PROJECT_DIR/index.html" ]]; then
                echo "Browser entrypoint found at $PROJECT_PATH/index.html."
              else
                echo "Browser entrypoint found at $PROJECT_PATH/dist/index.html."
              fi
              exit 0
            fi

            echo "No browser entrypoint found under $PROJECT_PATH (attempt $attempt/3)."
            if [[ "$attempt" -lt 3 ]]; then
              "$OPENCODE_BIN" run --auto --dangerously-skip-permissions \
                --attach "http://127.0.0.1:$OPENCODE_WEB_PORT" \
                --session "$SESSION_ID" \
                --model "$OPENCODE_MODEL" \
                "$ENTRYPOINT_PROMPT" \
                >> "$OPENCODE_WEB_DIR/entrypoint-fix-$attempt.log" 2>&1
            fi
          done

          echo "Browser verification cannot continue without index.html or dist/index.html." >&2
          exit 1

      - name: Expose verified app
        if: env.TEST_GH_REQUEST != 'true' && env.VALIDATION_ENABLED == 'true'
        id: app_tunnel
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          OPENCODE_BIN="$HOME/.opencode/bin/opencode"
          SESSION_ID='${{ steps.verification_fork.outputs.session_id }}'
          FIX_PROMPT="$(< "$RUNTIME_DIR/.github/prompts/03-public-app-fix.md")"

          for attempt in 1 2 3; do
            echo "Starting public app verification attempt $attempt/3."
            [[ ! -f "$OPENCODE_WEB_DIR/app.pid" ]] || kill "$(cat "$OPENCODE_WEB_DIR/app.pid")" 2>/dev/null || true
            [[ ! -f "$OPENCODE_WEB_DIR/app-cloudflared.pid" ]] || kill "$(cat "$OPENCODE_WEB_DIR/app-cloudflared.pid")" 2>/dev/null || true
            : > "$OPENCODE_WEB_DIR/app.log"
            : > "$OPENCODE_WEB_DIR/app-cloudflared.log"

            npm run start -- --port "$APP_PORT" >> "$OPENCODE_WEB_DIR/app.log" 2>&1 &
            echo $! > "$OPENCODE_WEB_DIR/app.pid"
            local_ok=''
            for _ in {1..30}; do
              if curl --fail --silent --show-error --max-time 3 "http://127.0.0.1:$APP_PORT" >/dev/null; then
                local_ok='yes'
                break
              fi
              sleep 1
            done

            if [[ "$local_ok" != 'yes' ]]; then
              echo "Local app health check failed on attempt $attempt."
            else
              "$OPENCODE_WEB_DIR/cloudflared" tunnel --no-autoupdate \
                --url "http://127.0.0.1:$APP_PORT" \
                > "$OPENCODE_WEB_DIR/app-cloudflared.log" 2>&1 &
              echo $! > "$OPENCODE_WEB_DIR/app-cloudflared.pid"
              APP_URL=''
              for _ in {1..60}; do
                APP_URL="$(sed -nE 's#.*(https://[a-z0-9-]+\.trycloudflare\.com).*#\1#p' \
                  "$OPENCODE_WEB_DIR/app-cloudflared.log" | head -n 1)"
                [[ -n "$APP_URL" ]] && break
                sleep 1
              done
              public_app_ok=''
              if [[ -n "$APP_URL" ]]; then
                for _ in {1..60}; do
                  if curl --fail --silent --show-error --max-time 10 "$APP_URL" >/dev/null; then
                    public_app_ok='yes'
                    break
                  fi
                  sleep 2
                done
              fi
              if [[ "$public_app_ok" == 'yes' ]]; then
                echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
                echo "Public app verified at $APP_URL."
                exit 0
              fi
              echo "Public app health check failed on attempt $attempt ($APP_URL)."
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "Sending OpenCode remediation prompt before retry $((attempt + 1))/3."
              "$OPENCODE_BIN" run --auto --dangerously-skip-permissions \
                --attach "http://127.0.0.1:$OPENCODE_WEB_PORT" \
                --session "$SESSION_ID" \
                --model "$OPENCODE_MODEL" \
                "$FIX_PROMPT" \
                >> "$OPENCODE_WEB_DIR/verification-fix-$attempt.log" 2>&1
            fi
          done

          echo 'Public app verification failed after 3 attempts.'
          exit 1
        env:
          OPENCODE_MODEL: ${{ steps.opencode_labels.outputs.model }}

      - name: Publish worker completion report
        if: env.TEST_GH_REQUEST != 'true' && env.VALIDATION_ENABLED == 'true'
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          OPENCODE_BIN="$HOME/.opencode/bin/opencode"
          completion_prompt="$(< "$RUNTIME_DIR/.github/prompts/04-completion-report.md")"
          completion_prompt="${completion_prompt//@APP_URL@/$APP_URL}"
          completion_prompt="${completion_prompt//@TRIGGER_ISSUE_NUMBER@/$TRIGGER_ISSUE_NUMBER}"
          "$OPENCODE_BIN" run --auto --dangerously-skip-permissions \
            --attach "http://127.0.0.1:$OPENCODE_WEB_PORT" \
            --session "${{ steps.verification_fork.outputs.session_id }}" \
            --model "${{ steps.opencode_labels.outputs.model }}" \
            "$completion_prompt" \
            > "$OPENCODE_WEB_DIR/completion-report.log" 2>&1
          touch "$OPENCODE_WEB_DIR/response-comment.done"

      - name: Request and verify final screenshots
        if: env.TEST_GH_REQUEST != 'true' && env.VALIDATION_ENABLED == 'true'
        id: final_evidence
        shell: bash
        run: |
          set -euo pipefail
          OPENCODE_BIN="$HOME/.opencode/bin/opencode"
          SESSION_ID='${{ steps.verification_fork.outputs.session_id }}'
          SCREENSHOT_PROMPT="$(< "$RUNTIME_DIR/.github/prompts/05-screenshot-evidence.md")"

          for attempt in 1 2 3; do
            screenshots=()
            while IFS= read -r screenshot; do
              screenshots+=("$screenshot")
            done < <(find "$PROJECT_DIR/screenshots" -type f \
              \( -iname 'final-*.png' -o -iname 'final-*.jpg' -o -iname 'final-*.jpeg' -o -iname 'final-*.webp' \) \
              -exec basename {} \; 2>/dev/null | sort)
            if [[ "${#screenshots[@]}" -gt 0 ]]; then
              printf '%s\n' "${screenshots[@]}"
              printf 'screenshots_json=%s\n' "$(printf '%s\n' "${screenshots[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
              printf 'screenshots_status=present\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "No final screenshots found under $PROJECT_PATH/screenshots/ (attempt $attempt/3)."
            if [[ "$attempt" -lt 3 ]]; then
              echo "Sending OpenCode screenshot remediation prompt before retry $((attempt + 1))/3."
              if ! "$OPENCODE_BIN" run --auto --dangerously-skip-permissions \
                --attach "http://127.0.0.1:$OPENCODE_WEB_PORT" \
                --session "$SESSION_ID" \
                --model '${{ steps.opencode_labels.outputs.model }}' \
                "$SCREENSHOT_PROMPT" \
                > "$OPENCODE_WEB_DIR/screenshot-fix-$attempt.log" 2>&1; then
                echo "OpenCode screenshot remediation failed on attempt $attempt; continuing to the next evidence check."
              fi
            fi
          done

          echo 'Final screenshots are still missing after three remediation attempts; continuing with delivery.'
          printf 'screenshots_json=[]\n' >> "$GITHUB_OUTPUT"
          printf 'screenshots_status=missing\n' >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: env.TEST_GH_REQUEST != 'true' && env.VALIDATION_ENABLED == 'true'
        id: delivery
        shell: bash
        run: |
          set -euo pipefail
          BASE_BRANCH="$TARGET_REF"
          # Dependencies are runtime-only and must never be included in the generated PR.
          touch "$PROJECT_DIR/.gitignore"
          grep -qxF 'node_modules/' "$PROJECT_DIR/.gitignore" || \
            printf '\nnode_modules/\n' >> "$PROJECT_DIR/.gitignore"
          git add -A -- "$PROJECT_PATH"
          if ! git diff --cached --quiet; then
            git commit -m "OpenCode: ${COMMENT_BODY%%$'\n'*}"
          fi
          if git diff --quiet "origin/$BASE_BRANCH..HEAD" -- "$PROJECT_PATH"; then
            echo 'OpenCode made no changes; no pull request will be created.'
            exit 0
          fi
          git push --set-upstream origin "$BRANCH_NAME"
          FINAL_COMMIT="$(git rev-parse HEAD)"
          TITLE="OpenCode: ${COMMENT_BODY%%$'\n'*}"
          TITLE="${TITLE:0:120}"
          if PR_URL="$(gh pr create --base "$BASE_BRANCH" --head "$BRANCH_NAME" \
            --title "$TITLE" \
            --body "Automated implementation requested in issue:\n\n$COMMENT_BODY")"; then
            echo "Pull request created: $PR_URL"
          else
            PR_URL=''
            echo 'Pull request creation was blocked; treating PR delivery as optional.' >&2
          fi
          printf 'commit=%s\npr_url=%s\n' "$FINAL_COMMIT" "$PR_URL" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare GitHub Pages result
        if: env.TEST_GH_REQUEST == 'true' || (env.VALIDATION_ENABLED == 'true' && env.PAGES_PUBLISH_ENABLED == 'true')
        continue-on-error: ${{ env.TEST_GH_REQUEST != 'true' }}
        id: pages_meta
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          FINAL_COMMIT: ${{ steps.delivery.outputs.commit || steps.test_delivery.outputs.commit }}
        run: |
          set -euo pipefail
          [[ -n "$FINAL_COMMIT" ]]

          # Vite emits root-relative asset URLs by default. A relative base keeps
          # each build working from its isolated Pages subdirectory.
          if jq -e '((.dependencies // {}) + (.devDependencies // {})) | has("vite")' package.json >/dev/null 2>&1; then
            npm run build -- --base=./
          fi

          publish_dir="$PROJECT_DIR/dist"
          if [[ -f "$publish_dir/index.html" ]]; then
            echo "Using built Pages entrypoint at $publish_dir/index.html."
          elif [[ -f "$PROJECT_DIR/index.html" ]]; then
            publish_dir="$RUNNER_TEMP/pages-build"
            mkdir -p "$publish_dir"
            rsync -a --exclude '.git' --exclude '.github' --exclude '.agents' \
              --exclude 'node_modules' --exclude 'screenshots' "$PROJECT_DIR/" "$publish_dir/"
            echo "Using static Pages entrypoint copied from $PROJECT_DIR/index.html."
          else
            echo "No index.html found at $PROJECT_DIR/index.html or $PROJECT_DIR/dist/index.html." >&2
            exit 1
          fi
          [[ -f "$publish_dir/index.html" ]]

          branch_slug="$(sed -E 's/[^[:alnum:]._-]+/-/g; s/^-+|-+$//g' <<<"$BRANCH_NAME" | tr '[:upper:]' '[:lower:]')"
          destination="branches/${branch_slug}/${FINAL_COMMIT:0:12}"
          owner_slug="$(tr '[:upper:]' '[:lower:]' <<<"$TARGET_OWNER")"
          target_repo_slug="$(tr '[:upper:]' '[:lower:]' <<<"$TARGET_REPO")"
          if [[ "$target_repo_slug" == "${owner_slug}.github.io" ]]; then
            pages_root="https://${owner_slug}.github.io"
          else
            pages_root="https://${owner_slug}.github.io/$TARGET_REPO"
          fi
          printf 'destination=%s\npublish_dir=%s\nurl=%s/%s/\n' "$destination" "$publish_dir" "$pages_root" "$destination" >> "$GITHUB_OUTPUT"

      - name: Publish branch result to GitHub Pages
        if: steps.pages_meta.outcome == 'success'
        id: pages_publish
        continue-on-error: ${{ env.TEST_GH_REQUEST != 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: ${{ steps.pages_meta.outputs.publish_dir }}
          destination_dir: ${{ steps.pages_meta.outputs.destination }}
          keep_files: true
          commit_message: "Publish ${{ env.BRANCH_NAME }} at ${{ steps.delivery.outputs.commit || steps.test_delivery.outputs.commit }}"

      - name: Assemble GitHub Pages site
        if: steps.pages_publish.outcome == 'success'
        id: pages_aggregate
        continue-on-error: ${{ env.TEST_GH_REQUEST != 'true' }}
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: .pages-site
          fetch-depth: 1
          persist-credentials: false

      - name: Upload GitHub Pages artifact
        if: steps.pages_aggregate.outcome == 'success'
        id: pages_artifact
        continue-on-error: ${{ env.TEST_GH_REQUEST != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/.pages-site

      - name: Deploy GitHub Pages site
        if: steps.pages_artifact.outcome == 'success'
        id: pages_deploy
        continue-on-error: ${{ env.TEST_GH_REQUEST != 'true' }}
        uses: actions/deploy-pages@v4

      - name: Record GitHub Pages URL
        if: steps.pages_deploy.outcome == 'success'
        id: pages_result
        continue-on-error: ${{ env.TEST_GH_REQUEST != 'true' }}
        shell: bash
        env:
          PAGES_SITE_URL: ${{ steps.pages_deploy.outputs.page_url }}
          PAGES_DESTINATION: ${{ steps.pages_meta.outputs.destination }}
        run: |
          set -euo pipefail
          PAGES_URL="${PAGES_SITE_URL%/}/${PAGES_DESTINATION#/}/"
          printf 'url=%s\n' "$PAGES_URL" >> "$GITHUB_OUTPUT"
          echo "Published permanent branch result: $PAGES_URL"
      - name: Create OpenCode logs release
        if: success() && env.TEST_GH_REQUEST != 'true' && env.VALIDATION_ENABLED == 'true'
        id: opencode_release
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/opencode-release"
          mkdir -p "$release_dir"

          # Preserve machine-readable responses and execution logs without
          # publishing OpenCode configuration, credentials, or SSH material.
          curl --fail --silent --show-error \
            -H "x-opencode-directory: $PROJECT_DIR" \
            "http://127.0.0.1:$OPENCODE_WEB_PORT/session/${{ steps.opencode_run.outputs.session_id }}/message" \
            > "$release_dir/opencode-response.json"
          if [[ ! -s "$release_dir/opencode-response.json" ]]; then
            echo 'OpenCode response artifact is empty; refusing to create an incomplete release.' >&2
            exit 1
          fi
          for artifact in "$OPENCODE_WEB_DIR"/*.log "$OPENCODE_WEB_DIR"/*.json; do
            [[ -f "$artifact" && -s "$artifact" ]] || continue
            [[ "$(basename "$artifact")" == 'opencode.json' ]] && continue
            cp -f "$artifact" "$release_dir/"
          done

          release_assets=()
          for asset in "$release_dir"/*; do
            [[ -f "$asset" && -s "$asset" ]] || continue
            release_assets+=("$asset")
          done
          ((${#release_assets[@]} > 0))

          tag="opencode-logs-${GITHUB_RUN_ID}"
          gh release create "$tag" "${release_assets[@]}" \
            --target "${{ steps.delivery.outputs.commit || github.sha }}" \
            --title "OpenCode logs for run #${GITHUB_RUN_NUMBER}" \
            --notes "Generated OpenCode response and execution logs for workflow run [#${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            --latest=false

          release_json="$(gh release view "$tag" --json url,assets)"
          printf 'url=%s\n' "$(jq -r '.url' <<<"$release_json")" >> "$GITHUB_OUTPUT"
          printf 'assets_json=%s\n' "$(jq -c '[.assets[] | {name, url: .browserDownloadUrl}]' <<<"$release_json")" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Post final game report
        if: success() && env.TEST_GH_REQUEST != 'true' && env.VALIDATION_ENABLED == 'true' && env.APP_URL != ''
        uses: actions/github-script@v7
        env:
          APP_URL: ${{ steps.pages_result.outputs.url || env.APP_URL }}
          GITHUB_PAGES_URL: ${{ steps.pages_result.outputs.url }}
          PAGES_PUBLISH_ENABLED: ${{ env.PAGES_PUBLISH_ENABLED }}
          FINAL_COMMIT: ${{ steps.delivery.outputs.commit }}
          PR_URL: ${{ steps.delivery.outputs.pr_url }}
          SCREENSHOTS_JSON: ${{ steps.final_evidence.outputs.screenshots_json }}
          PROJECT_PATH: ${{ env.PROJECT_PATH }}
          OPENCODE_RELEASE_URL: ${{ steps.opencode_release.outputs.url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const number = Number(process.env.TRIGGER_ISSUE_NUMBER);
            const commitUrl = `https://github.com/${process.env.TARGET_REPOSITORY}/commit/${process.env.FINAL_COMMIT}`;
            const screenshots = JSON.parse(process.env.SCREENSHOTS_JSON || '[]');
            const projectPath = process.env.PROJECT_PATH.replace(/^\.\//, '').replace(/\/$/, '');
            const images = screenshots.map((name) => {
              const path = [projectPath, 'screenshots', name].filter(Boolean).join('/').split('/').map(encodeURIComponent).join('/');
              const url = `https://raw.githubusercontent.com/${process.env.TARGET_REPOSITORY}/${process.env.FINAL_COMMIT}/${path}`;
              return `![Final game screenshot: ${name}](${url})`;
            });
            const body = [
              '✅ **Game complete and publicly verified.**', '',
              `Public app: [${process.env.APP_URL}](${process.env.APP_URL})`,
              ...(process.env.GITHUB_PAGES_URL ? [
                `GitHub Pages publication: [${process.env.GITHUB_PAGES_URL}](${process.env.GITHUB_PAGES_URL})`
              ] : [process.env.PAGES_PUBLISH_ENABLED === 'true'
                ? `GitHub Pages publishing could not be configured automatically. Enable it at [repository Settings → Pages](https://github.com/${process.env.TARGET_REPOSITORY}/settings/pages), choose **Deploy from a branch**, select **gh-pages** and **/(root)**, save, then rerun the issue.`
                : 'GitHub Pages publishing: skipped (disabled by repository variable).']),
              `Final commit: [${process.env.FINAL_COMMIT}](${commitUrl})`,
              `Pull request: ${process.env.PR_URL || 'Not created; PR delivery was blocked, but the generated commit is available.'}`,
              `OpenCode logs release: [${process.env.OPENCODE_RELEASE_URL}](${process.env.OPENCODE_RELEASE_URL})`,
              '', '<details><summary>Final screenshots</summary>', '', ...images, '', '</details>'
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: process.env.TARGET_OWNER,
              repo: process.env.TARGET_REPO,
              issue_number: number,
              per_page: 100
            });
            const liveComment = comments.find((comment) =>
              typeof comment.body === 'string' &&
              comment.body.includes('🟡 **OpenCode progress (live)**')
            );
            if (!liveComment) {
              throw new Error('Could not find the first OpenCode live-progress comment to update.');
            }
            await github.rest.issues.updateComment({
              owner: process.env.TARGET_OWNER,
              repo: process.env.TARGET_REPO,
              comment_id: liveComment.id,
              body: `${liveComment.body.trim()}\n\n${body}`
            });

      - name: Post test-gh Pages report
        if: success() && env.TEST_GH_REQUEST == 'true'
        uses: actions/github-script@v7
        env:
          GITHUB_PAGES_URL: ${{ steps.pages_result.outputs.url }}
          TEST_BRANCH_NAME: ${{ steps.test_delivery.outputs.branch }}
          FINAL_COMMIT: ${{ steps.test_delivery.outputs.commit }}
        with:
          github-token: ${{ github.token }}
          script: |
            const number = Number(process.env.TRIGGER_ISSUE_NUMBER);
            const runUrl = `https://github.com/${process.env.TARGET_REPOSITORY}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: process.env.TARGET_OWNER,
              repo: process.env.TARGET_REPO,
              issue_number: number,
              body: [
                '✅ **GitHub Pages smoke test passed.**', '',
                `Published Hello World from branch \`${process.env.TEST_BRANCH_NAME}\` at commit \`${process.env.FINAL_COMMIT}\`.`,
                `GitHub Pages: [${process.env.GITHUB_PAGES_URL}](${process.env.GITHUB_PAGES_URL})`,
                `Actions run: [#${context.runNumber}](${runUrl})`
              ].join('\n')
            });

      - name: Mark issue complete
        if: success() && env.GOAL_BLOCKED != 'true' && (env.TEST_GH_REQUEST == 'true' || env.VALIDATION_ENABLED == 'true')
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const number = Number(process.env.TRIGGER_ISSUE_NUMBER);
            await github.rest.issues.removeLabel({
              owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO,
              issue_number: number, name: 'in progress'
            }).catch((error) => { if (error.status !== 404) throw error; });
            await github.rest.issues.removeLabel({
              owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO,
              issue_number: number, name: 'validating'
            }).catch((error) => { if (error.status !== 404) throw error; });
            await github.rest.issues.addLabels({
              owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO,
              issue_number: number, labels: ['complete']
            });

      - name: Mark issue blocked
        if: failure() && env.GOAL_BLOCKED == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const number = Number(process.env.TRIGGER_ISSUE_NUMBER);
            const runUrl = `https://github.com/${process.env.TARGET_REPOSITORY}/actions/runs/${context.runId}`;
            for (const name of ['in progress', 'validating', 'complete', 'failed']) {
              await github.rest.issues.removeLabel({
                owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO,
                issue_number: number, name
              }).catch((error) => { if (error.status !== 404) throw error; });
            }
            await github.rest.issues.addLabels({
              owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO,
              issue_number: number, labels: ['blocked']
            });
            await github.rest.issues.createComment({
              owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO,
              issue_number: number,
              body: [
                '🟠 **OpenCode Goal remains blocked.**', '',
                'The workflow detected `[goal:blocked]`, sent bounded harsh critiques through OpenCode Zen, and the same session still reported a blocked Goal.',
                `Actions run: [${runUrl}](${runUrl})`,
                '', 'No completion claim was published.'
              ].join('\n')
            });

      - name: Mark issue failed
        if: failure() && env.GOAL_BLOCKED != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const number = Number(process.env.TRIGGER_ISSUE_NUMBER);
            const runUrl = `https://github.com/${process.env.TARGET_REPOSITORY}/actions/runs/${context.runId}`;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });
            const failedSteps = jobs
              .flatMap((job) => (job.steps || [])
                .filter((step) => step.conclusion === 'failure')
                .map((step) => `${job.name}: ${step.name}`));
            const details = failedSteps.length
              ? failedSteps.map((step) => `- \`${step}\``).join('\n')
              : '- See the workflow logs for the failing step.';
            await github.rest.issues.createComment({
              owner: process.env.TARGET_OWNER,
              repo: process.env.TARGET_REPO,
              issue_number: number,
              body: [
                '❌ **OpenCode workflow failed.**', '',
                `Actions run: ${runUrl}`,
                '', '**Failed step(s):**', details
              ].join('\n')
            });
            await github.rest.issues.removeLabel({
              owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO,
              issue_number: number, name: 'in progress'
            }).catch((error) => { if (error.status !== 404) throw error; });
            await github.rest.issues.removeLabel({
              owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO,
              issue_number: number, name: 'validating'
            }).catch((error) => { if (error.status !== 404) throw error; });
            await github.rest.issues.addLabels({
              owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO,
              issue_number: number, labels: ['failed']
            });

      - name: Keep temporary access available for 5 hours
        if: success() && env.TEST_GH_REQUEST != 'true'
        shell: bash
        run: sleep 18000

      - name: Append SSH session closed
        if: always() && env.AGENTSWEB_SSH_ENABLED == 'true' && steps.agentsweb.outcome == 'success' && steps.access_comment.outputs.comment_id != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: process.env.TARGET_OWNER, repo: process.env.TARGET_REPO,
              issue_number: Number(process.env.TRIGGER_ISSUE_NUMBER),
              body: `🔒 **AgentsWeb SSH session closed.**\n\nTemporary access for [run #${context.runNumber}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) has expired.`
            });

      - name: Clean up OpenCode session
        if: always()
        shell: bash
        run: |
          set +e
          [[ -f "$OPENCODE_WEB_DIR/cloudflared.pid" ]] && kill "$(cat "$OPENCODE_WEB_DIR/cloudflared.pid")" 2>/dev/null || true
          [[ -f "$OPENCODE_WEB_DIR/opencode.pid" ]] && kill "$(cat "$OPENCODE_WEB_DIR/opencode.pid")" 2>/dev/null || true
          [[ -f "$OPENCODE_WEB_DIR/opencode-run.pid" ]] && kill "$(cat "$OPENCODE_WEB_DIR/opencode-run.pid")" 2>/dev/null || true
          [[ -f "$OPENCODE_WEB_DIR/response-comment-tracker.pid" ]] && kill "$(cat "$OPENCODE_WEB_DIR/response-comment-tracker.pid")" 2>/dev/null || true
          [[ -f "$OPENCODE_WEB_DIR/app-cloudflared.pid" ]] && kill "$(cat "$OPENCODE_WEB_DIR/app-cloudflared.pid")" 2>/dev/null || true
          [[ -f "$OPENCODE_WEB_DIR/app.pid" ]] && kill "$(cat "$OPENCODE_WEB_DIR/app.pid")" 2>/dev/null || true
          tmux kill-session -t app-server 2>/dev/null || true
          [[ -f "$SSH_DIR/tunnel.pid" ]] && kill "$(cat "$SSH_DIR/tunnel.pid")" 2>/dev/null || true
          sudo pkill -f 'sshd.*2222' 2>/dev/null || true
          rm -f "$SSH_KEY" "$SSH_PUBLIC_KEY"
          rm -rf "$SSH_DIR" "$HOME/.ssh/authorized_keys"
          rm -rf "$OPENCODE_WEB_DIR"
