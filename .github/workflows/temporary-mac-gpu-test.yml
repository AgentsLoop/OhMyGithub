name: Temporary Mac GPU test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Inspect Mac hardware and Metal
        shell: bash
        run: |
          set -euo pipefail
          echo '--- runner ---'
          echo "RUNNER_NAME=$RUNNER_NAME"
          sw_vers
          uname -a
          system_profiler SPHardwareDataType SPDisplaysDataType
          sysctl -n hw.ncpu hw.memsize

          cat > /tmp/metal_test.swift <<'SWIFT'
          import Foundation
          import Metal

          guard let device = MTLCreateSystemDefaultDevice() else {
              fputs("Metal device: none\n", stderr)
              exit(2)
          }
          print("Metal device: \(device.name)")
          print("Metal low power: \(device.isLowPower)")
          print("Metal recommended max working set: \(device.recommendedMaxWorkingSetSize)")

          let shader = """
          #include <metal_stdlib>
          using namespace metal;
          kernel void madd(device float *a [[buffer(0)]],
                           device float *b [[buffer(1)]],
                           device float *c [[buffer(2)]],
                           uint id [[thread_position_in_grid]]) {
              c[id] = a[id] * 1.000001f + b[id];
          }
          """

          do {
              let library = try device.makeLibrary(source: shader, options: nil)
              guard let function = library.makeFunction(name: "madd"),
                    let pipeline = try? device.makeComputePipelineState(function: function),
                    let queue = device.makeCommandQueue() else {
                  fputs("Metal compute setup failed\n", stderr)
                  exit(3)
              }

              let count = 1 << 20
              let iterations = 100
              let bytes = count * MemoryLayout<Float>.stride
              let a = device.makeBuffer(length: bytes, options: .storageModeShared)!
              let b = device.makeBuffer(length: bytes, options: .storageModeShared)!
              let c = device.makeBuffer(length: bytes, options: .storageModeShared)!
              let ap = a.contents().bindMemory(to: Float.self, capacity: count)
              let bp = b.contents().bindMemory(to: Float.self, capacity: count)
              for i in 0..<count { ap[i] = 1.0; bp[i] = 2.0 }

              let start = DispatchTime.now().uptimeNanoseconds
              for _ in 0..<iterations {
                  let command = queue.makeCommandBuffer()!
                  let encoder = command.makeComputeCommandEncoder()!
                  encoder.setComputePipelineState(pipeline)
                  encoder.setBuffer(a, offset: 0, index: 0)
                  encoder.setBuffer(b, offset: 0, index: 1)
                  encoder.setBuffer(c, offset: 0, index: 2)
                  let width = pipeline.threadExecutionWidth
                  let threads = MTLSize(width: count, height: 1, depth: 1)
                  let groups = MTLSize(width: (count + width - 1) / width, height: 1, depth: 1)
                  encoder.dispatchThreads(threads, threadsPerThreadgroup: MTLSize(width: width, height: 1, depth: 1))
                  encoder.endEncoding()
                  command.commit()
                  command.waitUntilCompleted()
                  if command.status != .completed { exit(4) }
                  _ = groups
              }
              let elapsed = Double(DispatchTime.now().uptimeNanoseconds - start) / 1_000_000_000.0
              let operations = Double(count * iterations * 2)
              print(String(format: "Metal compute: %.3f s, %.2f GFLOP/s, %.2f million elements/s", elapsed, operations / elapsed / 1e9, Double(count * iterations) / elapsed / 1e6))
          }
          SWIFT

          swiftc /tmp/metal_test.swift -framework Metal -o /tmp/metal_test
          /tmp/metal_test
