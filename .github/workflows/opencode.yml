name: OpenCode
run-name: "OpenCode #${{ inputs.issue_number }} — ${{ inputs.issue_title }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue containing the OpenCode label
        required: true
      request:
        description: Exact issue request text
        required: true
      issue_title:
        description: Issue title for the Actions run name
        required: true
      labels_json:
        description: JSON array of issue label names
        required: false
        default: '[]'
      sender:
        description: GitHub username that submitted the request
        required: true
      vercel_publish_enabled:
        description: Whether to publish the verified result to Vercel
        required: false
        default: true
        type: boolean
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  opencode:
    uses: ./.github/workflows/opencode-reusable.yml
    with:
      issue_number: ${{ inputs.issue_number }}
      request: ${{ inputs.request }}
      issue_title: ${{ inputs.issue_title }}
      labels_json: ${{ inputs.labels_json }}
      sender: ${{ inputs.sender }}
      vercel_publish_enabled: ${{ inputs.vercel_publish_enabled }}
    secrets: inherit
