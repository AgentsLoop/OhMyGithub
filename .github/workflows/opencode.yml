name: OpenCode
run-name: "OpenCode #${{ github.event.issue.number }} — ${{ github.event.issue.title }}"

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: ${{ (github.event.label.name == 'OpenCode' || (github.event.action == 'opened' && vars.OPENCODE_ACCESS == 'everyone' && contains(github.event.issue.title, '/OpenCode') && !contains(github.event.issue.labels.*.name, 'OpenCode'))) && format('opencode-issue-{0}-{1}', github.repository, github.event.issue.number) || format('opencode-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.label.name == 'OpenCode' || (github.event.action == 'opened' && vars.OPENCODE_ACCESS == 'everyone' && contains(github.event.issue.title, '/OpenCode') && !contains(github.event.issue.labels.*.name, 'OpenCode'))
    uses: ./.github/workflows/opencode-prepare.yml
    with:
      runtime_ref: ${{ github.workflow_sha }}
  opencode:
    needs: prepare
    if: needs.prepare.outputs.approved == 'true'
    uses: ./.github/workflows/opencode-reusable.yml
    permissions:
      contents: write
      issues: write
      actions: read
    with:
      runtime_ref: ${{ github.workflow_sha }}
      issue_number: ${{ needs.prepare.outputs.issue_number }}
      request: ${{ needs.prepare.outputs.request }}
      issue_title: ${{ needs.prepare.outputs.issue_title }}
      labels_json: ${{ needs.prepare.outputs.labels_json }}
      sender: ${{ needs.prepare.outputs.sender }}
      target_ref: ${{ needs.prepare.outputs.target_ref }}
      target_sha: ${{ needs.prepare.outputs.target_sha }}
    secrets: inherit
