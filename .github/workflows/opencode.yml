name: OMG
run-name: "OMG #${{ inputs.issue_number || github.event.issue.number }} — ${{ inputs.issue_title || github.event.issue.title }}"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue containing the /omg request
        required: true
      request:
        description: Exact /omg request text
        required: true
      issue_title:
        description: Issue title for the Actions run name
        required: true
      labels_json:
        description: JSON array of issue label names
        required: false
        default: '[]'
      sender:
        description: GitHub login that submitted the request
        required: true
      source:
        description: Dispatch source identifier
        required: false
        default: manual
      target_repository:
        description: Fallback target repository; empty means this repository
        required: false
      target_owner:
        description: Fallback target owner
        required: false
      target_repo:
        description: Fallback target repository name
        required: false
      target_ref:
        description: Fallback target default branch
        required: false
      installation_id:
        description: GitHub App installation ID used for traceability
        required: false
  issue_comment:
    types: [created]
  issues:
    types: [opened, edited]

jobs:
  opencode:
    uses: ./.github/workflows/opencode-reusable.yml
    with:
      target_repository: ${{ inputs.target_repository || github.repository }}
      target_owner: ${{ inputs.target_owner || github.repository_owner }}
      target_repo: ${{ inputs.target_repo || github.event.repository.name }}
      target_ref: ${{ inputs.target_ref || github.event.repository.default_branch }}
      issue_number: ${{ inputs.issue_number || github.event.issue.number }}
      request: ${{ inputs.request || github.event.comment.body || github.event.issue.body || github.event.issue.title }}
      issue_title: ${{ inputs.issue_title || github.event.issue.title }}
      labels_json: ${{ inputs.labels_json || toJSON(github.event.issue.labels.*.name) }}
      sender: ${{ inputs.sender || github.event.sender.login }}
      use_app_token: ${{ inputs.target_repository != '' }}
    secrets: inherit
