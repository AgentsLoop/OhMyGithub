<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Square - Reset Demo</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="container">
  <div id="square" class="square"></div>
  <button id="reset" class="btn">Reset</button>
</main>
<script>
(function(){
  const square = document.getElementById('square');
  const btn = document.getElementById('reset');
   let posX = 0;
  let posY = 0;

  // Click square to move it randomly, Reset brings it back to centered blue square
  square.addEventListener('click', function(){
    posX = (Math.random() - 0.5) * 200;
    posY = (Math.random() - 0.5) * 100;
    square.style.transform = 'translate(' + posX + 'px,' + posY + 'px)';
  });

  btn.addEventListener('click', function(){
    posX = 0;
    posY = 0;
    square.style.transform = 'translate(0,0)';
    square.style.backgroundColor = '#0000ff';
    // flash animation so click is observable even if already at origin
    square.classList.remove('reset-flash');
    void square.offsetWidth;
    square.classList.add('reset-flash');
    setTimeout(function(){ square.classList.remove('reset-flash'); }, 400);
  });
})();
</script>
</body>
</html>
