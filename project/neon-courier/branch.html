<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Branch — codex/omgithub-site</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    display:grid;place-items:center;
    background:#0d1020;
    color:#f0eaff;
    font-family:'JetBrains Mono',monospace,system-ui,sans-serif;
  }
  .branch{
    font-size:clamp(24px,6vw,48px);
    font-weight:800;
    letter-spacing:0.04em;
    background:rgba(255,211,77,0.12);
    border:1px solid rgba(255,211,77,0.35);
    color:#ffd34d;
    padding:24px 32px;
    border-radius:16px;
    box-shadow:0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(255,211,77,0.15);
    text-align:center;
    word-break:break-all;
  }
  .label{
    display:block;
    font-size:12px;
    letter-spacing:0.2em;
    color:#9aa0c8;
    margin-bottom:12px;
    font-weight:700;
  }
</style>
</head>
<body>
  <div class="branch" data-branch="codex/omgithub-site"><span class="label">SELECTED BRANCH</span>codex/omgithub-site</div>
</body>
</html>
